<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request a Commercial Cleaning Quote │ Anuva</title>
    <meta
      name="description"
      content="Request a commercial cleaning quote or consultation from Anuva."
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main">
      <section class="hero hero--page">
        <div class="wrap">
          <h1>Let's talk about your facility</h1>
          <p class="lead">
            Tell us about your facility, event, or contract
            requirements. Our team will review your needs and help determine the
            appropriate next step.
          </p>
          <div class="btn-row"></div>
        </div>
      </section>
      <section class="section">
        <div class="wrap">
          <h2>Consultation Request</h2>
          <form
            id="contactForm"
            action="https://formspree.io/f/xwlpvoaa"
            method="POST"
          >
            <input type="hidden" name="access_key" value="7a30736ee4b14f94a2ff4e7b9866f2d1" />
            <input type="checkbox" name="botcheck" style="display: none" />
            <input
              type="text"
              name="_gotcha"
              tabindex="-1"
              autocomplete="off"
              style="position:absolute; left:-9999px; opacity:0; pointer-events:none;"
            />

            <label>
              Name
            <input type="text"  name="name"  placeholder="Your name" required>
            </label>

            <label>
              Company / Organization
              <input type="text" name="org" />
            </label>

            <label>
              Email
          <input type="email" name="email" placeholder="Your email" required>
            </label>

            <label>
              Phone
              <input type="tel" name="phone" />
            </label>

            <label>
              Type of facility
              <select name="facility">
                <option>Government</option>
                <option>Construction</option>
                <option>Commercial</option>
                <option>Healthcare</option>
                <option>Education</option>
                <option>Venue / Event</option>
                <option>Other</option>
              </select>
            </label>

            <label>
              Facility or project location
              <input type="text" name="location" />
            </label>

            <label>
              Approximate square footage
              <input type="text" name="sqft" />
            </label>

            <label>
              Service frequency
              <select name="frequency">
                <option>One-time</option>
                <option>Daily</option>
                <option>Several times per week</option>
                <option>Weekly</option>
                <option>Event</option>
                <option>Construction project</option>
                <option>Other</option>
              </select>
            </label>

            <label>
              Requested start date
              <input type="date" name="start" />
            </label>

            <label>
              Tell us about your cleaning requirements
              <textarea name="details" rows="5"></textarea>
            </label>

            <label class="check">
              <input type="checkbox" name="prevailing" />
              This project has prevailing-wage or government labor requirements.
            </label>

            <label class="check">
              <input type="checkbox" name="rfp" />
              This request relates to an RFP / RFQ / government solicitation.
            </label>

            <button class="btn" type="submit" style="margin: 2rem 0rem;">
              Submit
            </button>
          </form>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/main.js"></script>
    <script>
      document.getElementById('contactForm')?.addEventListener('submit', async function (event) {
        const gotcha = this.querySelector('input[name="_gotcha"]');
        if (gotcha && gotcha.value) {
          event.preventDefault();
          return;
        }

        const form = event.currentTarget;
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: {
            Accept: 'application/json',
          },
        });

        if (response.ok) {
          window.location.href = 'thank-you.html';
        }
      });
    </script>
  </body>
</html>
